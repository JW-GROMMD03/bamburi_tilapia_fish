services:
  # Backend - Django API
  - type: web
    name: bamburi-tilapia-backend
    env: python
    rootDir: backend
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn fishflow_backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"

  # Frontend - Static HTML/JS/CSS
  - type: static
    name: bamburi-tilapia-frontend
    rootDir: frontend
    buildCommand: echo "Bamburi Tilapia Fish Hotel - Frontend Ready"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /index.html
        destination: /index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache